<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食材拼图 × 外卖营业 V1.0 灰盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #1e1e24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #333;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 960px;
      background: #f8f6f0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    /* --- Receipt Printer Header --- */
    #printer-header {
      background: #2b2d42;
      padding: 8px 12px 4px;
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .printer-slit {
      background: #111;
      height: 5px;
      border-radius: 3px;
      margin-bottom: 4px;
    }
    .printer-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .revenue-badge {
      font-weight: bold;
      color: #ffd166;
    }
    .goal-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .goal-progress-fill {
      height: 100%;
      width: 0%;
      background: #06d6a0;
      transition: width 0.3s ease;
    }

    /* Hanging Receipt Paper */
    #receipt-paper {
      background: #ffffff;
      padding: 8px 14px;
      margin: 0 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      position: relative;
      font-size: 12px;
      z-index: 9;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    #receipt-paper::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 6px;
      background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
      background-size: 12px 12px;
    }
    .receipt-top {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .receipt-checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f0f0f0;
    }
    .check-item.done {
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
    }
    .next-order-hint {
      margin-top: 4px;
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Cascade Banner */
    #cascade-banner {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #ef476f;
      color: #fff;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(239,71,111,0.5);
      z-index: 30;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #cascade-banner.show {
      transform: translateX(-50%) scale(1.1);
    }

    /* Warning banner */
    #danger-banner {
      display: none;
      background: #ffd166;
      color: #8d4f00;
      padding: 4px 8px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      z-index: 15;
    }

    /* --- Core Board Area --- */
    #board-wrapper {
      flex: 1;
      position: relative;
      margin: 6px;
      border-radius: 8px;
      background: #ede8dc;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
    }
    #board-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- Bottom Bar --- */
    #bottom-bar {
      height: 48px;
      background: #2b2d42;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      font-size: 12px;
      z-index: 10;
    }
    .inventory-tray {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 65%;
      padding: 2px 0;
    }
    .inv-chip {
      background: rgba(255,255,255,0.15);
      padding: 2px 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      white-space: nowrap;
    }
    .sys-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .sys-btn:active {
      background: rgba(255,255,255,0.4);
    }

    /* Overlay Modals */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      display: none;
    }
    .modal-card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal-card h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }
    .modal-card p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .action-btn {
      background: #06d6a0;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Receipt Printer & Header -->
    <div id="printer-header">
      <div class="printer-slit"></div>
      <div class="printer-controls">
        <span id="day-title">DAY 01</span>
        <span class="revenue-badge" id="revenue-display">¥0 / ¥400</span>
      </div>
      <div class="goal-progress-bar">
        <div class="goal-progress-fill" id="goal-progress-fill"></div>
      </div>
    </div>

    <!-- Hanging Receipt Paper -->
    <div id="receipt-paper">
      <div class="receipt-top">
        <span id="order-id-dish">#0832 田园沙拉</span>
        <span id="order-revenue" style="color: #e63946;">¥70</span>
      </div>
      <div class="receipt-checklist" id="receipt-checklist">
        <!-- Checklist items populated dynamically -->
      </div>
      <div class="next-order-hint" id="next-order-hint">
        下一单: 🥪 经典三明治
      </div>
    </div>

    <div id="danger-banner">⚠️ 棋盘空间告急！请尽快拼合食材腾出空间！</div>
    <div id="cascade-banner">⚡ CASCADE x2! +10%</div>

    <!-- 88% Core Board Canvas -->
    <div id="board-wrapper">
      <canvas id="board-canvas"></canvas>
    </div>

    <!-- Bottom Bar (PrepInventory + Controls) -->
    <div id="bottom-bar">
      <div class="inventory-tray" id="inventory-tray">
        <!-- e.g. 🍞 x1, 🥚 x2 -->
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="sys-btn" id="btn-audio">🔊</button>
        <button class="sys-btn" id="btn-restart">重来</button>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="modal-victory">
      <div class="modal-card">
        <h2>🎉 营业目标达成！</h2>
        <p id="victory-summary">今日营业额达标，订单全部按时交付！</p>
        <button class="action-btn" id="btn-next-day">进入下一天</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="modal-failed">
      <div class="modal-card">
        <h2 style="color: #e63946;">🚫 棋盘阻塞</h2>
        <p>棋盘没有空间容纳新碎片，且无合法拼图解可腾出空间。</p>
        <button class="action-btn" id="btn-retry" style="background: #e63946;">重新开始</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
